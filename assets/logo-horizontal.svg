<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <!-- Tealwater Capital - Horizontal Wordmark with Wave -->
  <!-- Clean, standalone for headers, letterheads, email signatures, marketing -->
  
  <!-- Water wave icon - centered above text -->
  <g transform="translate(450, 55)">
    <path d="M-38,-14 C-27,-26 -12,-26 0,-14 C12,-2 27,-2 38,-14" 
          fill="none" stroke="#6B8B92" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M-28,2 C-17,-8 -5,-8 5,2 C15,12 27,12 38,2" 
          fill="none" stroke="#6B8B92" stroke-width="3.8" stroke-linecap="round"/>
  </g>
  
  <!-- TEALWATER CAPITAL wordmark -->
  <text x="450" y="130" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-weight="normal" 
        font-size="38" 
        letter-spacing="10" 
        fill="#5F868E" 
        text-anchor="middle">TEALWATER CAPITAL</text>
</svg>